<head>

  <title>Renders para Griferia y Accesorios | Calyco Renders</title>
  <meta name="description" content="Nos especializamos en renders 3D de grifería y accesorios con un alto nivel de detalle. Diseño fototorrealistico en entornos 100% digitales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body {
      background: #000;
      color: #f5f5f5;
      margin: 0;
      font-family: 'Manrope', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    .contact-page {
      width: 100%;
      min-height: calc(100vh - 76px);
      background: #050505;
    }

    .contact-split {
      display: flex;
      width: 100%;
      min-height: calc(100vh - 76px);
      background: #000;
    }

    .contact-visual {
      position: relative;
      width: 42%;
      min-height: calc(100vh - 76px);
      overflow: hidden;
      background: #111;
    }

    .contact-slider {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .contact-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 800ms ease;
      pointer-events: none;
    }

    .contact-slide.active {
      opacity: 1;
    }

    .contact-slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--object-position, center center);
      display: block;
    }

    .contact-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.08) 0%,
        rgba(0, 0, 0, 0.12) 35%,
        rgba(0, 0, 0, 0.78) 100%
      );
      z-index: 1;
    }

    .contact-slider-nav {
      position: absolute;
      inset: 50% 18px auto 18px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .contact-slider-btn {
      width: 30px;
      height: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.18);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      transition: background-color 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
      font-size: 1rem;
      padding: 0;
    }

    .contact-slider-btn:hover,
    .contact-slider-btn:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .contact-slider-dots {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }

    .contact-slider-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, 0.45);
      padding: 0;
      pointer-events: auto;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .contact-slider-dot.active {
      background: rgba(255, 255, 255, 0.95);
      transform: scale(1.15);
    }

    .contact-overlay {
      position: absolute;
      left: 50%;
      top: 72%;
      transform: translateX(-50%);
      z-index: 2;
      width: max-content;
      max-width: 80%;
      padding: 10px 12px;
      text-align: left;
      background: rgba(0, 0, 0, 0.14);
    }

    .contact-overlay::before {
      content: "";
      position: absolute;
      inset: -10px -14px;
      background: rgba(0, 0, 0, 0.14);
      z-index: -1;
    }

    .contact-overlay p {
      margin: 0 0 7px;
      color: rgba(255, 255, 255, 0.9);
      font-family: "Montserrat", Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: 0.015em;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .contact-overlay p:last-child {
      margin-bottom: 0;
      font-size: 1.2em;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .contact-overlay a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      text-decoration: none;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .contact-overlay a:hover,
    .contact-overlay a:focus-visible {
      opacity: 0.8;
    }

    .contact-panel {
      width: 58%;
      background: #0a0a0a;
      padding: 56px 56px 52px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact-title {
      margin: 0 0 26px;
      color: #fff;
      font-size: clamp(2.2rem, 3vw, 4rem);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      font-weight: 600;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 620px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
      color: #fff;
      padding: 16px 18px;
      font: inherit;
      resize: vertical;
      min-height: 52px;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: rgba(255, 255, 255, 0.52);
    }

    .contact-form textarea {
      min-height: 160px;
    }

    .contact-form button {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #fff;
      color: #111;
      padding: 16px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .contact-form button:hover,
    .contact-form button:focus-visible {
      opacity: 0.92;
    }

    .contact-form button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .form-success {
      margin: 0;
      display: none;
      color: #ffffff;
      font-size: 0.92rem;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    .form-success.error {
      color: #ffb3b3;
    }

    @media (max-width: 768px) {
      .site-header {
        height: 80px;
      }

      .navbar {
        min-height: 80px;
        height: 80px;
        padding: 8px 18px;
      }

      .contact-split {
        display: block;
      }

      .contact-visual {
        width: 100%;
        height: 250px;
        min-height: 0;
        overflow: hidden;
      }

      .contact-visual img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 78%;
      }

      .contact-panel {
        width: 100%;
        padding: 12px 24px 16px;
      }

      .contact-title {
        font-size: 36px;
        margin: 0 0 16px;
      }

      .contact-form {
        max-width: 100%;
        gap: 10px;
      }

      .contact-form input,
      .contact-form textarea {
        min-height: 58px;
        height: 58px;
        padding: 12px 14px;
      }

      .contact-form textarea {
        min-height: 105px;
        height: 105px;
      }

      .contact-form button {
        height: 54px;
        padding: 0 18px;
      }

      .contact-overlay {
        top: auto;
        bottom: 14px;
        left: auto;
        right: 24px;
        transform: none !important;
        width: calc(100% - 48px);
        max-width: calc(100% - 48px);
        box-sizing: border-box;
        padding: 7px 8px;
        overflow: visible;
      }

      .contact-overlay p {
        font-size: 11.9px;
        line-height: 1.02;
        margin-bottom: 4px;
        gap: 8px;
      }
      .contact-overlay p:first-child {
        white-space: nowrap;
      }
      .contact-overlay p:last-child {
        font-size: 13.3px;
        letter-spacing: 2px;
        white-space: nowrap;
      }
      .contact-overlay svg {
        width: 14.5px !important;
        height: 14.5px !important;
      }
      .form-success {
        margin: 0;
        display: none;
      }
    }
  </style>
